<style>

    --f-body:"Source Serif 4","Noto Sans KR",Georgia,serif;

  @media (prefers-color-scheme:dark){

      --surface:#1A1C20;

    --rule:#2B2E34;
    --accent:#8FA4FF;
  }

  *{box-sizing:border-box}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--f-display);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}
  a:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

  .wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--gutter)}

  /* ---------- nav ---------- */
  .nav{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:60;
    background:color-mix(in srgb,var(--paper) 88%,transparent);
    backdrop-filter:blur(10px);
  }
  .nav-inner{
    display:flex;align-items:baseline;gap:clamp(16px,4vw,60px);flex-wrap:wrap;
    padding-block:18px 16px;
  }
  .brand{
    font-weight:700;font-stretch:118%;font-size:13px;letter-spacing:.02em;
    margin-right:auto;
  }
  .brand em{font-style:normal;color:var(--ink-faint);font-weight:400;font-stretch:100%}
  .nav a.item{
    font-size:12.5px;letter-spacing:.03em;font-weight:500;color:var(--ink-soft);
    padding-bottom:2px;border-bottom:1px solid transparent;transition:color .18s,border-color .18s;
  }
  .nav a.item:hover{color:var(--ink)}
  .nav a.item[aria-current="page"]{color:var(--ink);border-color:var(--accent)}

  /* ---------- statement ---------- */
  .statement{
    padding-block:clamp(56px,13vh,130px) clamp(44px,8vh,90px);
    text-align:center;
  }
  .statement p{
    font-family:var(--f-body);font-size:clamp(15px,1.5vw,18px);line-height:1.65;
    color:var(--ink-soft);max-width:44ch;margin:0 auto;text-wrap:balance;
  }
  .statement p + p{margin-top:.5em}
  .statement .mark{color:var(--ink)}

  /* ---------- work grid ---------- */
  .grid{
    display:grid;grid-template-columns:repeat(3,1fr);
    gap:clamp(22px,3.4vw,54px) clamp(14px,2.4vw,34px);
    padding-bottom:110px;
  }
  @media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
  @media (max-width:560px){.grid{grid-template-columns:1fr;gap:34px}}

  .tile{display:block;opacity:0;transform:translateY(14px);animation:rise .7s cubic-bezier(.2,.7,.25,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.tile{animation:none;opacity:1;transform:none}}
  .tile .frame{
    position:relative;overflow:hidden;background:var(--surface);
    aspect-ratio:4/5;max-width:100%;
  }
  .tile .frame.photo{aspect-ratio:16/9}
  .tile .frame svg,.tile .frame img{
    display:block;width:100%;height:100%;object-fit:cover;
    transition:transform .75s cubic-bezier(.2,.7,.25,1);
  }
  .tile:hover .frame svg,.tile:hover .frame img{transform:scale(1.035)}
  .tile .meta{padding-top:11px;display:flex;gap:10px;align-items:baseline}
  .tile .idx{font-family:var(--f-util);font-size:10.5px;color:var(--ink-faint);flex:none}
  .tile h3{
    margin:0;font-size:13px;font-weight:500;font-stretch:104%;
    line-height:1.45;color:var(--ink-soft);transition:color .18s;
  }
  .tile h3 .yr{color:var(--ink-faint)}
  .tile:hover h3{color:var(--accent)}

  /* ---------- project detail ---------- */
  .detail{padding-block:clamp(26px,5vh,54px) 110px}
  .detail-head{
    display:grid;grid-template-columns:1fr minmax(0,38%);gap:clamp(20px,4vw,60px);
    align-items:end;padding-bottom:clamp(22px,4vh,44px);
    border-bottom:1px solid var(--rule);
  }
  @media (max-width:760px){.detail-head{grid-template-columns:1fr;align-items:start;gap:22px}}
  .detail h1{
    margin:0;font-size:clamp(26px,5vw,58px);font-weight:600;font-stretch:112%;
    line-height:1.04;letter-spacing:-.02em;text-wrap:balance;
  }
  .eyebrow{
    font-family:var(--f-util);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 14px;
  }
  .detail-body{
    font-family:var(--f-kr);font-size:14px;line-height:1.85;
    color:var(--ink-soft);margin:0;max-width:46ch;
  }
  .plates{display:grid;gap:clamp(14px,2vw,26px);padding-top:clamp(24px,4vh,50px)}
  .plate{background:var(--surface);overflow:hidden}
  .plate svg,.plate img,.plate video{display:block;width:100%;height:auto;max-width:100%}
  .plate .embed{position:relative;width:100%;aspect-ratio:16/9}
  .plate .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  /* 세로로 아주 긴 한 장짜리 이미지(포폴 시트)는 가운데로 모아 읽기 좋게 */
  .plate.tall{max-width:980px;margin-inline:auto;background:none}
  .plates .wide{grid-column:1/-1}
  @media (min-width:761px){.plates{grid-template-columns:1fr 1fr}}
  .credits{
    display:grid;gap:3px;padding-top:clamp(26px,4vh,52px);
    font-family:var(--f-util);font-size:11.5px;line-height:1.75;color:var(--ink-soft);
  }
  .credits b{font-weight:500;color:var(--ink-faint)}

    display:flex;justify-content:space-between;gap:20px;

    font-size:12.5px;font-weight:500;
  }

  .lede{
    font-family:var(--f-body);font-size:clamp(20px,2.6vw,32px);line-height:1.45;

  }
  .lede b{font-weight:400;color:var(--accent)}

  @media (max-width:760px){.cols{grid-template-columns:1fr;gap:34px}}
  .prose{font-family:var(--f-kr);font-size:14.5px;line-height:1.85;color:var(--ink-soft);max-width:52ch}
  .prose p{margin:0 0 1.1em}
  .prose p:last-child{margin-bottom:0}
  .listing{display:grid;gap:0;margin:0;padding:0;list-style:none}
  .listing li{
    display:grid;grid-template-columns:5.4em 1fr;gap:14px;align-items:baseline;
    padding-block:11px;border-top:1px solid var(--rule);
    font-size:13px;color:var(--ink-soft);
  }
  .listing li span{font-family:var(--f-util);font-size:11px;color:var(--ink-faint)}
  .sec-label{
    font-family:var(--f-util);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--ink-faint);margin:0 0 12px;
  }
  .block + .block{margin-top:clamp(32px,5vh,58px)}

  /* ---------- process ---------- */
  .steps{display:grid;gap:0}
  .step{
    display:grid;grid-template-columns:4.5em 1fr minmax(0,44%);gap:clamp(14px,3vw,44px);
    padding-block:clamp(20px,3vh,32px);border-top:1px solid var(--rule);align-items:start;
  }
  @media (max-width:760px){
    .step{grid-template-columns:3.4em 1fr;gap:14px}
    .step .step-note{grid-column:2/-1;margin-top:8px}
  }
  .step .num{font-family:var(--f-util);font-size:11px;color:var(--accent);padding-top:5px}
  .step h3{margin:0;font-size:clamp(17px,2.2vw,24px);font-weight:600;font-stretch:108%;letter-spacing:-.01em}
  .step .dur{font-family:var(--f-util);font-size:11px;color:var(--ink-faint);margin-top:8px}
  .step-note{font-family:var(--f-kr);font-size:13.5px;line-height:1.8;color:var(--ink-soft)}

  /* ---------- contact ---------- */
  .contact-grid{display:grid;gap:0}
  .contact-grid a,.contact-grid .row{
    display:grid;grid-template-columns:7.5em 1fr;gap:14px;align-items:baseline;

  .foot{border-top:1px solid var(--rule)}
  .foot-inner{
    display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between;

/* 실제로 화면에 쓰이는 데이터 — 로딩 후 Supabase 내용으로 교체됩니다 */

/* =========================================================
   ARTWORK — 각 프로젝트 그래픽을 코드로 그립니다.
   ========================================================= */
function art(p, W, H){
  const bg = p.pal[0], a = p.pal[1], b = p.pal[2];
  const s = [];
  s.push('<rect width="' + W + '" height="' + H + '" fill="' + bg + '"/>');
  const m = p.motif;

  if(m === "arcs"){
    const cx = W*0.5, cy = H*0.58;
    for(let i=7;i>=1;i--){
      const r = Math.min(W,H)*0.46*(i/7);
      s.push('<path d="M ' + (cx-r) + ' ' + cy + ' A ' + r + ' ' + r + ' 0 0 1 ' + (cx+r) + ' ' + cy + '" fill="none" stroke="' + (i%2?a:b) + '" stroke-width="' + (W*0.026) + '"/>');
    }
    s.push('<rect x="0" y="' + cy + '" width="' + W + '" height="' + (H-cy) + '" fill="' + bg + '"/>');
    s.push('<text x="' + (W*0.5) + '" y="' + (cy+H*0.16) + '" text-anchor="middle" fill="' + a + '" font-family="Archivo, sans-serif" font-size="' + (W*0.12) + '" font-weight="700" letter-spacing="' + (W*0.012) + '">' + p.word + '</text>');
  }
  else if(m === "stack"){
    const n = 7, pad = W*0.12;
    for(let i=0;i<n;i++){
      const y = H*0.14 + i*(H*0.66/n);
      const inset = pad + i*(W*0.032);
      s.push('<rect x="' + inset + '" y="' + y + '" width="' + (W-inset*2) + '" height="' + (H*0.66/n*0.62) + '" fill="' + (i%2?a:b) + '" opacity="' + (0.35+0.09*i).toFixed(2) + '"/>');
    }
    s.push('<text x="' + (W*0.12) + '" y="' + (H*0.93) + '" fill="' + a + '" font-family="Noto Sans KR, sans-serif" font-size="' + (W*0.075) + '" font-weight="500">' + p.word + '</text>');
  }
  else if(m === "grid"){
    const cols = 5, rows = 7, cw = W*0.76/cols, ch = H*0.68/rows, ox = W*0.12, oy = H*0.12;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const on = ((r*3 + c*5) % 7) < 3;
        s.push('<rect x="' + (ox+c*cw+1) + '" y="' + (oy+r*ch+1) + '" width="' + (cw-2) + '" height="' + (ch-2) + '" fill="' + (on?b:a) + '" opacity="' + (on?"1":"0.16") + '"/>');
      }
    }
    s.push('<text x="' + (W*0.12) + '" y="' + (H*0.94) + '" fill="' + a + '" font-family="IBM Plex Mono, monospace" font-size="' + (W*0.055) + '">' + p.word + '</text>');
  }
  else if(m === "type"){
    s.push('<rect x="' + (W*0.5) + '" y="0" width="' + (W*0.5) + '" height="' + H + '" fill="' + b + '" opacity="0.10"/>');
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.62) + '" text-anchor="middle" fill="' + a + '" font-family="Archivo, sans-serif" font-size="' + (W*0.28) + '" font-weight="700" letter-spacing="' + (-W*0.012) + '">' + p.word + '</text>');
    for(let i=0;i<5;i++){
      s.push('<rect x="0" y="' + (H*0.30 + i*H*0.085) + '" width="' + W + '" height="' + (H*0.016) + '" fill="' + bg + '"/>');
    }
  }
  else if(m === "waves"){
    for(let i=0;i<9;i++){
      const y = H*0.18 + i*(H*0.075);
      s.push('<path d="M 0 ' + y + ' Q ' + (W*0.25) + ' ' + (y-H*0.05) + ' ' + (W*0.5) + ' ' + y + ' T ' + W + ' ' + y + '" fill="none" stroke="' + (i===4?b:a) + '" stroke-width="' + (i===4?W*0.018:W*0.010) + '" opacity="' + (i===4?"1":"0.7") + '"/>');
    }
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.93) + '" text-anchor="middle" fill="' + a + '" font-family="Archivo, sans-serif" font-size="' + (W*0.10) + '" font-weight="600" letter-spacing="' + (W*0.02) + '">' + p.word + '</text>');
  }
  else if(m === "beads"){
    for(let i=0;i<26;i++){
      const t = i/25, x = W*0.14 + t*W*0.72, y = H*0.48 + Math.sin(t*Math.PI*2.2)*H*0.22;
      const r = W*0.026 + Math.sin(t*Math.PI)*W*0.028;
      s.push('<circle cx="' + x.toFixed(1) + '" cy="' + y.toFixed(1) + '" r="' + r.toFixed(1) + '" fill="' + (i%3?a:b) + '" opacity="' + (0.55+0.45*Math.sin(t*Math.PI)).toFixed(2) + '"/>');
    }
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.93) + '" text-anchor="middle" fill="' + a + '" font-family="Noto Sans KR, sans-serif" font-size="' + (W*0.10) + '" font-weight="500">' + p.word + '</text>');
  }
  else if(m === "checker"){
    const n = 6, c = W/n;
    for(let r=0;r<Math.ceil(H/c);r++){
      for(let k=0;k<n;k++){
        if((r+k)%2===0) s.push('<rect x="' + (k*c) + '" y="' + (r*c) + '" width="' + c + '" height="' + c + '" fill="' + a + '" opacity="0.14"/>');
      }
    }
    s.push('<circle cx="' + (W*0.36) + '" cy="' + (H*0.40) + '" r="' + (W*0.19) + '" fill="' + a + '"/>');
    s.push('<rect x="' + (W*0.50) + '" y="' + (H*0.44) + '" width="' + (W*0.32) + '" height="' + (W*0.32) + '" fill="' + b + '"/>');
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.94) + '" text-anchor="middle" fill="' + b + '" font-family="Archivo, sans-serif" font-size="' + (W*0.10) + '" font-weight="700" letter-spacing="' + (W*0.02) + '">' + p.word + '</text>');
  }
  else if(m === "blob"){
    for(let i=0;i<5;i++){
      const r = W*(0.30 - i*0.045);
      s.push('<circle cx="' + (W*0.5) + '" cy="' + (H*0.45) + '" r="' + r + '" fill="' + (i%2?a:b) + '" opacity="' + (0.20+i*0.16).toFixed(2) + '"/>');
    }
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.93) + '" text-anchor="middle" fill="' + a + '" font-family="Noto Sans KR, sans-serif" font-size="' + (W*0.10) + '" font-weight="500" letter-spacing="' + (W*0.02) + '">' + p.word + '</text>');
  }
  else {
    for(let i=-6;i<20;i++){
      s.push('<rect x="' + (i*W*0.09) + '" y="' + (-H*0.2) + '" width="' + (W*0.045) + '" height="' + (H*1.5) + '" fill="' + (i%4===0?b:a) + '" opacity="' + (i%4===0?"1":"0.85") + '" transform="rotate(-24 ' + (W*0.5) + ' ' + (H*0.5) + ')"/>');
    }
    s.push('<rect x="' + (W*0.08) + '" y="' + (H*0.40) + '" width="' + (W*0.84) + '" height="' + (H*0.20) + '" fill="' + bg + '"/>');
    s.push('<text x="' + (W*0.5) + '" y="' + (H*0.545) + '" text-anchor="middle" fill="' + a + '" font-family="Archivo, sans-serif" font-size="' + (W*0.11) + '" font-weight="700" letter-spacing="' + (W*0.015) + '">' + p.word + '</text>');
  }
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project artwork">' + s.join("") + '</svg>';
}

const view = document.getElementById("view");
const esc = (t) => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function workView(){

      '<h3>' + esc(p.title) + '<br><span class="yr">' + p.year + '</span></h3></div>' +

const ALT = {arcs:"grid", grid:"arcs", type:"stripes", stripes:"type", stack:"blob", blob:"stack", waves:"beads", beads:"waves", checker:"grid"};

/* images 배열에 영상 주소가 섞여 있으면 영상으로 재생합니다.
   - Supabase Storage 등에 올린 .mp4/.webm/.mov → 바로 재생
   - Vimeo / YouTube 링크 → 임베드 플레이어 */
function media(src){
  if(/\.(mp4|webm|mov|m4v)(\?|$)/i.test(src)){
    return '<video controls playsinline preload="metadata" src="' + src + '"></video>';
  }
  const vim = src.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/([0-9a-z]+))?/i);
  if(vim){
    return '<div class="embed"><iframe src="https://player.vimeo.com/video/' + vim[1] +
      (vim[2] ? '?h=' + vim[2] : '') + '" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="video"></iframe></div>';
  }
  const yt = src.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]+)/i);
  if(yt){
    return '<div class="embed"><iframe src="https://www.youtube.com/embed/' + yt[1] +
      '" allow="accelerometer; autoplay; clipboard-write; encrypted-media; picture-in-picture" allowfullscreen title="video"></iframe></div>';
  }
  return null;
}

function projectView(slug){
  const i = PROJECTS.findIndex(p => p.slug === slug);
  if(i < 0) return workView();
  const p = PROJECTS[i];
  const prev = PROJECTS[(i-1+PROJECTS.length)%PROJECTS.length];
  const next = PROJECTS[(i+1)%PROJECTS.length];
  const alt = {motif: ALT[p.art.motif] || "grid", pal: p.art.pal, word: p.art.word};
  const flip = {motif: p.art.motif, pal: [p.art.pal[1], p.art.pal[0], p.art.pal[2]], word: p.art.word};
  const imgs = (p.images && p.images.length) ? p.images : (p.cover_url ? [p.cover_url] : null);
  const plates = imgs
    ? imgs.map((src,n) => {
        const m = media(src);
        // 영상은 2열 그리드에 그대로 배치. 이미지 첫 장만 가로로 크게.
        const wide = (!m && n===0) || (imgs.length%2===1 && n===imgs.length-1) ? ' wide' : '';
        return '<div class="plate' + wide + '">' + (m ||
          '<img src="' + src + '" alt="' + esc(p.title) + '" loading="lazy" ' +
          'onload="if(this.naturalHeight/this.naturalWidth>2){this.parentNode.classList.add(\'wide\',\'tall\')}">'
        ) + '</div>';
      }).join("")
    : '<div class="plate wide">' + art(p.art,1200,700) + '</div>' +
      '<div class="plate">' + art(alt,600,750) + '</div>' +
      '<div class="plate">' + art(flip,600,750) + '</div>';
  return '<article class="detail">' +
    '<header class="detail-head"><div>' +
      '<p class="eyebrow">' + String(i+1).padStart(2,"0") + ' / ' + p.year + '</p>' +
      '<h1>' + esc(p.title) + '</h1></div>' +
      '<p class="detail-body" lang="ko">' + esc(p.body) + '</p>' +
    '</header>' +
    '<div class="plates">' + plates + '</div>' +
    '<div class="credits">' + p.credits.map(c => '<div><b>' + esc(c[0]) + '.</b> ' + esc(c[1]) + '</div>').join("") + '</div>' +
    '<nav class="pager">' +
      '<a href="#/work/' + prev.slug + '">&larr; ' + esc(prev.title) + '</a>' +
      '<a href="#/work/' + next.slug + '">' + esc(next.title) + ' &rarr;</a>' +
    '</nav></article>';
}

/* =========================================================
   ROUTER
   ========================================================= */
function render(){
  const hash = location.hash.replace(/^#\/?/, "") || "work";
  const parts = hash.split("/");
  const route = parts[0], slug = parts[1];
  let html, current = route;
  if(route === "work" && slug) html = projectView(slug);
  else if(route === "about") html = aboutView();
  else if(route === "process") html = processView();
  else if(route === "contact") html = contactView();
  else { html = workView(); current = "work"; }
  view.innerHTML = html;
  document.querySelectorAll(".nav a.item").forEach(a => {
    if(a.dataset.route === current) a.setAttribute("aria-current","page");
    else a.removeAttribute("aria-current");
  });
  window.scrollTo(0,0);
}
addEventListener("hashchange", render);
render();

/* =========================================================
   LOAD FROM SUPABASE
   projects / site_settings 를 읽어 화면을 다시 그립니다.
   실패하면 위의 FALLBACK 내용이 그대로 남습니다.
   ========================================================= */
function rowToProject(r){
  const pal = (Array.isArray(r.pal) && r.pal.length === 3) ? r.pal : ["#EFEFEC","#16181C","#4A6CF0"];
  return {
    slug: r.slug,
    title: r.title,
    year: r.year || "",
    body: r.body || "",
    cover_url: r.cover_url || null,
    images: Array.isArray(r.images) ? r.images : [],
    credits: Array.isArray(r.credits) ? r.credits : [],
    art: {motif: r.motif || "grid", pal: pal, word: r.word || r.title.slice(0,5)}
  };
}

(async function load(){
  const status = document.getElementById("source");
  try{
    const [rows, settings] = await Promise.all([
      sb("projects?select=*&published=eq.true&order=sort_order.asc,id.asc"),
      sb("site_settings?select=data&id=eq.1").catch(() => [])
    ]);
    if(rows && rows.length){
      PROJECTS = rows.map(rowToProject);
      SOURCE = "supabase";
    }
    if(settings && settings.length && settings[0].data){
      STUDIO = Object.assign({}, FALLBACK_STUDIO, settings[0].data);
    }
    if(SOURCE === "supabase"){
      status.textContent = "Supabase · " + PROJECTS.length + " projects";
      status.style.color = "var(--accent)";
      render();
    } else {
      status.textContent = "Supabase 연결됨 · 프로젝트 없음";
    }
  } catch(err){
    console.warn("[supabase]", err.message);
    status.textContent = "Supabase 연결 실패 — 기본 데이터 표시 중";
  }
})();

document.getElementById("back").addEventListener("click", () => {
  if(location.hash && location.hash !== "#/work") history.back();
  else window.scrollTo({top:0, behavior:"smooth"});
});
document.getElementById("top").addEventListener("click", () => window.scrollTo({top:0, behavior:"smooth"}));
